<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UC Math Little Genius 🌟 Mental Math for Kids</title>
  <link rel="shortcut icon" href="" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700;800&family=Quicksand:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
      --primary: #4a90e2;
      --primary-dark: #2c6cb0;
      --accent: #ff6b81;
      --accent-hover: #ff4757;
      --yellow: #feca57;
      --green: #2ed573;
      --green-dark: #26af5f;
      --red: #ff4757;
      --purple: #8854d0;
      --card-bg: rgba(255, 255, 255, 0.96);
      --shadow: 0 16px 40px rgba(74, 144, 226, 0.22);
      --font-main: 'Fredoka', 'Quicksand', system-ui, -apple-system, sans-serif;
      --font-nums: 'Fredoka', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--font-main);
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-x: hidden;
      color: #2d3436;
      position: relative;
    }

    /* Floating Canvas for Confetti & Celebrations */
    #celebration-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9999;
    }

    /* Background Playful Bubbles */
    .bubble {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.35);
      animation: floatBubble 12s infinite ease-in-out;
      pointer-events: none;
      z-index: 0;
    }

    .bubble:nth-child(1) { width: 110px; height: 110px; left: 8%; top: 12%; animation-duration: 14s; }
    .bubble:nth-child(2) { width: 70px; height: 70px; right: 10%; top: 22%; animation-duration: 10s; }
    .bubble:nth-child(3) { width: 90px; height: 90px; left: 18%; bottom: 15%; animation-duration: 16s; }
    .bubble:nth-child(4) { width: 130px; height: 130px; right: 14%; bottom: 10%; animation-duration: 13s; }

    @keyframes floatBubble {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-28px) scale(1.08); }
    }

    /* Top Control Bar */
    .top-bar {
      width: 100%;
      max-width: 540px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      z-index: 10;
    }

    .stars-badge {
      background: white;
      padding: 8px 20px;
      border-radius: 50px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.08);
      font-size: 1.35rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #ff9f1a;
      border: 2px solid #ffeaa7;
    }

    .stars-icon {
      animation: spinStars 4s ease-in-out infinite;
      display: inline-block;
    }

    @keyframes spinStars {
      0%, 100% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(18deg) scale(1.15); }
    }

    .mode-settings {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      background: white;
      border: none;
      border-radius: 50px;
      padding: 9px 18px;
      font-family: var(--font-main);
      font-size: 1rem;
      font-weight: 700;
      color: #2f3542;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(0,0,0,0.08);
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .icon-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.12);
      background: #fdfdfd;
    }

    .icon-btn:active {
      transform: translateY(1px);
    }

    /* Main Game Card */
    .game-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border-radius: 36px;
      box-shadow: var(--shadow);
      border: 5px solid rgba(255, 255, 255, 0.9);
      width: 100%;
      max-width: 480px;
      padding: 24px 20px 28px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 5;
    }

    /* Mascot Avatar */
    .mascot-container {
      position: relative;
      margin-top: -54px;
      margin-bottom: 8px;
      cursor: pointer;
    }

    .mascot-avatar {
      width: 105px;
      height: 105px;
      background: linear-gradient(135deg, #ffd32a 0%, #ff9f1a 100%);
      border-radius: 50%;
      border: 5px solid white;
      box-shadow: 0 10px 24px rgba(255, 159, 26, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      animation: mascotHover 3.5s ease-in-out infinite;
    }

    @keyframes mascotHover {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    .mascot-avatar.speaking {
      animation: mascotSpeak 0.45s ease-in-out infinite alternate !important;
      box-shadow: 0 0 0 10px rgba(255, 159, 26, 0.35), 0 12px 28px rgba(255, 159, 26, 0.45);
    }

    @keyframes mascotSpeak {
      0% { transform: scale(1) translateY(0); }
      100% { transform: scale(1.08) translateY(-4px); }
    }

    .mascot-svg {
      width: 82px;
      height: 82px;
    }

    .headphones-badge {
      position: absolute;
      bottom: 0;
      right: -4px;
      background: #ff4757;
      color: white;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      border: 3px solid white;
      box-shadow: 0 4px 8px rgba(0,0,0,0.15);
    }

    /* Audio Replay Button */
    .btn-audio-repeat {
      background: linear-gradient(135deg, #4a90e2 0%, #2f75d6 100%);
      color: white;
      border: none;
      border-radius: 50px;
      padding: 10px 24px;
      font-family: var(--font-main);
      font-size: 1.15rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 8px 20px rgba(74, 144, 226, 0.35);
      border-bottom: 4px solid #1a56a6;
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      margin-bottom: 10px;
    }

    .btn-audio-repeat:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(74, 144, 226, 0.45);
    }

    .btn-audio-repeat:active {
      transform: translateY(2px);
      border-bottom-width: 2px;
    }

    .btn-audio-repeat.speaking {
      background: linear-gradient(135deg, #2ed573 0%, #10ac84 100%);
      border-bottom-color: #0e8062;
      animation: pulseBtn 1s infinite alternate;
    }

    @keyframes pulseBtn {
      0% { transform: scale(1); }
      100% { transform: scale(1.04); }
    }

    .soundwave {
      display: flex;
      align-items: center;
      gap: 3px;
      height: 18px;
    }

    .soundwave span {
      width: 3px;
      height: 100%;
      background: white;
      border-radius: 3px;
      animation: wave 1s ease-in-out infinite;
    }

    .soundwave span:nth-child(1) { animation-delay: 0.1s; height: 40%; }
    .soundwave span:nth-child(2) { animation-delay: 0.3s; height: 80%; }
    .soundwave span:nth-child(3) { animation-delay: 0.2s; height: 100%; }
    .soundwave span:nth-child(4) { animation-delay: 0.4s; height: 60%; }

    @keyframes wave {
      0%, 100% { transform: scaleY(0.4); }
      50% { transform: scaleY(1); }
    }

    /* Status Instruction Text */
    .status-text {
      font-size: 1.15rem;
      font-weight: 700;
      color: #57606f;
      margin-bottom: 12px;
      min-height: 28px;
      text-align: center;
      transition: all 0.3s;
    }

    /* Parent Peek */
    .parent-peek {
      background: #f1f2f6;
      border: 1px dashed #ced6e0;
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #747d8c;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 8px;
      transition: all 0.2s;
    }

    .parent-peek:hover {
      background: #e4e7eb;
      color: #2f3542;
    }

    .peek-content {
      font-family: var(--font-nums);
      font-size: 1.25rem;
      font-weight: 700;
      color: #2f3542;
      background: #fff;
      padding: 2px 10px;
      border-radius: 12px;
      border: 2px solid #747d8c;
      display: none;
    }

    /* Answer Input Fields */
    .answer-inputs-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 16px;
      width: 100%;
    }

    .inputs-container {
      display: flex;
      justify-content: center;
      gap: 16px;
      direction: ltr; /* Left-to-Right: Tens on Left, Units on Right */
    }

    .digit-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .digit-label {
      font-size: 1rem;
      font-weight: 800;
      color: #747d8c;
    }

    .digit-input {
      width: 82px;
      height: 94px;
      background: white;
      border: 4px solid #dcdde1;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-nums);
      font-size: 3.4rem;
      font-weight: 800;
      color: #2f3542;
      box-shadow: inset 0 3px 8px rgba(0,0,0,0.06), 0 6px 16px rgba(0,0,0,0.06);
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
    }

    .digit-input.active {
      border-color: #4a90e2;
      box-shadow: 0 0 0 5px rgba(74, 144, 226, 0.25), 0 8px 20px rgba(74, 144, 226, 0.18);
      transform: translateY(-2px) scale(1.03);
    }

    .digit-input.active::after {
      content: '';
      position: absolute;
      bottom: 8px;
      width: 32px;
      height: 4px;
      background: #ff4757;
      border-radius: 2px;
      animation: blinkCursor 0.8s infinite alternate;
    }

    @keyframes blinkCursor {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    /* Wrong Shake Animation */
    .shake-error {
      animation: shakeAnim 0.5s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
      border-color: #ff4757 !important;
      background-color: #ffebee !important;
      box-shadow: 0 0 0 6px rgba(255, 71, 87, 0.35) !important;
    }

    @keyframes shakeAnim {
      10%, 90% { transform: translate3d(-3px, 0, 0); }
      20%, 80% { transform: translate3d(5px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
      40%, 60% { transform: translate3d(6px, 0, 0); }
    }

    /* Success Pop Animation */
    .success-pop {
      animation: popWin 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
      border-color: #2ed573 !important;
      background-color: #e8f8f0 !important;
      box-shadow: 0 0 0 6px rgba(46, 213, 115, 0.35) !important;
    }

    @keyframes popWin {
      0% { transform: scale(0.9); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    /* Custom Number Keypad */
    .keypad-container {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 4px;
      transition: all 0.3s ease;
    }

    .keypad-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
    }

    .key-btn {
      background: white;
      border: 3px solid #e4e9f2;
      border-radius: 20px;
      height: 64px;
      font-family: var(--font-nums);
      font-size: 2.2rem;
      font-weight: 700;
      color: #2f3542;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 5px 0 #cbd5e1, 0 8px 16px rgba(0,0,0,0.06);
      transition: all 0.1s ease;
    }

    .key-btn:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #cbd5e1, 0 3px 8px rgba(0,0,0,0.05);
    }

    .key-btn:hover {
      background: #f8faff;
      border-color: #c2d1e8;
    }

    /* Reset button placed in bottom row under 7 */
    .key-btn.key-reset {
      background: #eff6ff;
      border: 3px solid #bfdbfe;
      color: #1d4ed8;
      box-shadow: 0 5px 0 #93c5fd, 0 8px 16px rgba(59, 130, 246, 0.12);
      font-size: 1.15rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .key-btn.key-reset:hover {
      background: #dbeafe;
      border-color: #93c5fd;
    }

    .key-btn.key-reset:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #93c5fd, 0 3px 8px rgba(59, 130, 246, 0.05);
    }

    /* Delete button placed under 9 */
    .key-btn.key-del {
      background: #ffecf0;
      border: 3px solid #ffccd5;
      color: #ff4757;
      box-shadow: 0 5px 0 #fca5a5, 0 8px 16px rgba(255, 71, 87, 0.12);
      font-size: 1.35rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .key-btn.key-del:hover {
      background: #ffe3e8;
      border-color: #fca5a5;
    }

    .key-btn.key-del:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #fca5a5, 0 3px 8px rgba(255, 71, 87, 0.05);
    }

    /* Action Buttons Area */
    .actions-area {
      width: 100%;
      max-width: 380px;
      margin-top: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-action {
      width: 100%;
      padding: 15px 24px;
      border-radius: 50px;
      border: none;
      font-family: var(--font-main);
      font-size: 1.4rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .btn-check {
      background: linear-gradient(135deg, #ff9f43 0%, #ff5252 100%);
      color: white;
      box-shadow: 0 10px 24px rgba(255, 82, 82, 0.35);
      border-bottom: 5px solid #d63031;
    }

    .btn-check:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 28px rgba(255, 82, 82, 0.42);
    }

    .btn-check:active {
      transform: translateY(3px);
      border-bottom-width: 2px;
    }

    .btn-next {
      background: linear-gradient(135deg, #2ed573 0%, #10ac84 100%);
      color: white;
      box-shadow: 0 10px 24px rgba(46, 213, 115, 0.4);
      border-bottom: 5px solid #0e8062;
      display: none;
      animation: pulseNext 1.5s infinite;
    }

    @keyframes pulseNext {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }

    .btn-retry {
      background: linear-gradient(135deg, #ff9f43 0%, #ee5253 100%);
      color: white;
      box-shadow: 0 10px 24px rgba(238, 82, 83, 0.38);
      border-bottom: 5px solid #b33939;
      display: none;
      animation: pulseNext 1.4s infinite;
    }

    /* Auto-Dismissing Feedback Popup Modal */
    .feedback-popup-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      cursor: pointer;
    }

    .feedback-popup-overlay.show {
      display: flex;
    }

    .feedback-popup-card {
      background: white;
      border-radius: 30px;
      padding: 30px 24px;
      width: 90%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 25px 60px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      transform: scale(0.6);
      animation: popInBounce 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes popInBounce {
      0% { opacity: 0; transform: scale(0.6); }
      70% { opacity: 1; transform: scale(1.08); }
      100% { opacity: 1; transform: scale(1); }
    }

    .feedback-popup-icon {
      font-size: 3.6rem;
      animation: bounceMascot 1s infinite alternate ease-in-out;
    }

    @keyframes bounceMascot {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(-8px) scale(1.1); }
    }

    .feedback-popup-text {
      font-family: var(--font-main);
      font-size: 1.45rem;
      font-weight: 800;
      color: #2f3542;
      line-height: 1.35;
    }

    .feedback-popup-card.success {
      border: 4px solid #2ed573;
      background: linear-gradient(to bottom, #ffffff, #f0fdf4);
    }
    .feedback-popup-card.success .feedback-popup-text {
      color: #15803d;
    }

    .feedback-popup-card.error {
      border: 4px solid #ff4757;
      background: linear-gradient(to bottom, #ffffff, #fff1f2);
    }
    .feedback-popup-card.error .feedback-popup-text {
      color: #b91c1c;
    }

    .feedback-popup-card.warning {
      border: 4px solid #f59e0b;
      background: linear-gradient(to bottom, #ffffff, #fffbeb);
    }
    .feedback-popup-card.warning .feedback-popup-text {
      color: #b45309;
    }

    .feedback-popup-equation {
      background: #eff6ff;
      border: 3px solid #60a5fa;
      border-radius: 20px;
      padding: 10px 24px;
      font-family: var(--font-nums);
      font-size: 2.1rem;
      font-weight: 800;
      color: #1e40af;
      letter-spacing: 1.5px;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.15);
      animation: popWin 0.4s ease-out;
      display: none;
    }

    .solved-problem-badge {
      background: #f0fdf4;
      border: 2px solid #86efac;
      border-radius: 50px;
      padding: 6px 20px;
      font-family: var(--font-nums);
      font-size: 1.35rem;
      font-weight: 800;
      color: #15803d;
      margin-bottom: 12px;
      display: none;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(34, 197, 94, 0.12);
      animation: popWin 0.3s ease-out;
    }

    .feedback-popup-hint {
      font-size: 0.85rem;
      color: #94a3b8;
      font-weight: 600;
    }

    /* Settings Modal */
    .settings-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10000;
    }

    .modal-card {
      background: white;
      border-radius: 28px;
      padding: 24px;
      width: 90%;
      max-width: 440px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
      text-align: left;
    }

    .modal-title {
      font-size: 1.35rem;
      font-weight: 800;
      margin-bottom: 16px;
      color: #2f3542;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .setting-group {
      margin-bottom: 16px;
    }

    .setting-label {
      font-size: 1rem;
      font-weight: 800;
      color: #57606f;
      margin-bottom: 8px;
      display: block;
    }

    .level-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .level-btn {
      background: #f1f2f6;
      border: 2px solid #e4e7eb;
      border-radius: 16px;
      padding: 10px 12px;
      font-family: var(--font-main);
      font-size: 0.95rem;
      font-weight: 700;
      color: #57606f;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }

    .level-btn:hover {
      background: #e4e7eb;
    }

    .level-btn.active {
      background: #eff6ff;
      border-color: #3b82f6;
      color: #1d4ed8;
      font-weight: 800;
    }

    .btn-reset-storage {
      background: #fff1f2;
      border: 2px dashed #fda4af;
      border-radius: 16px;
      padding: 10px 14px;
      font-family: var(--font-main);
      font-size: 0.95rem;
      font-weight: 800;
      color: #e11d48;
      cursor: pointer;
      width: 100%;
      text-align: center;
      transition: all 0.2s;
    }

    .btn-reset-storage:hover {
      background: #ffe4e6;
    }

    .btn-close-modal {
      background: linear-gradient(135deg, #4a90e2 0%, #2f75d6 100%);
      color: white;
      border: none;
      border-radius: 50px;
      padding: 13px;
      width: 100%;

  <script>
    /* ==========================================================================
       UC MATH KIDS APPLICATION LOGIC (100% ENGLISH)
       ========================================================================== */

    // Sound Synthesizer via Web Audio API (100% Offline & Pure Sound)
    class SoundEngine {
      constructor() {
        this.ctx = null;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      // Friendly button tap click
      playTap() {
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, this.ctx.currentTime + 0.08);

        gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start();
        osc.stop(this.ctx.currentTime + 0.08);
      }

      // Joyful Success Fanfare
      playFanfare() {
        this.init();
        if (!this.ctx) return;
        const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.1);

          gain.gain.setValueAtTime(0.2, this.ctx.currentTime + idx * 0.1);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + idx * 0.1 + 0.28);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(this.ctx.currentTime + idx * 0.1);
          osc.stop(this.ctx.currentTime + idx * 0.1 + 0.28);
        });
      }

      // Comical Gentle Wrong Boing
      playComicalWrong() {
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(280, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(120, this.ctx.currentTime + 0.35);

        gain.gain.setValueAtTime(0.18, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.35);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start();
        osc.stop(this.ctx.currentTime + 0.35);
      }
    }

    // Celebratory Confetti Cannon
    class ConfettiCannon {
      constructor(canvas) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        this.particles = [];
        this.animationId = null;

        this.resize();
        window.addEventListener('resize', () => this.resize());
      }

      resize() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
      }

      fire() {
        const colors = ['#ff4757', '#2ed573', '#1e90ff', '#ffa502', '#9b59b6', '#ffd32a'];
        const particleCount = 100;

        for (let i = 0; i < particleCount; i++) {
          this.particles.push({
            x: this.canvas.width / 2 + (Math.random() - 0.5) * 200,
            y: this.canvas.height * 0.45,
            vx: (Math.random() - 0.5) * 16,
            vy: (Math.random() - 0.8) * 18,
            size: Math.random() * 9 + 5,
            color: colors[Math.floor(Math.random() * colors.length)],
            rotation: Math.random() * 360,
            vRot: (Math.random() - 0.5) * 12,
            opacity: 1,
            gravity: 0.4
          });
        }

        if (!this.animationId) {
          this.animate();
        }
      }

      animate() {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

        for (let i = this.particles.length - 1; i >= 0; i--) {
          const p = this.particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vy += p.gravity;
          p.rotation += p.vRot;
          p.opacity -= 0.012;

          if (p.opacity <= 0 || p.y > this.canvas.height) {
            this.particles.splice(i, 1);
            continue;
          }

          this.ctx.save();
          this.ctx.translate(p.x, p.y);
          this.ctx.rotate((p.rotation * Math.PI) / 180);
          this.ctx.globalAlpha = Math.max(0, p.opacity);
          this.ctx.fillStyle = p.color;
          this.ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.7);
          this.ctx.restore();
        }

        if (this.particles.length > 0) {
          this.animationId = requestAnimationFrame(() => this.animate());
        } else {
          this.animationId = null;
          this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        }
      }
    }

    // Main App Controller
    class UCMathApp {
      constructor() {
        this.sound = new SoundEngine();
        this.confetti = new ConfettiCannon(document.getElementById('celebration-canvas'));

        // Default App States
        this.score = 0;
        this.currentLevel = 3; // 1: single digits, 2: up to 20, 3: up to 99, 4: up to 99 with 3 steps
        this.speechRate = 0.75; // Slow & friendly
        this.popupDuration = 2; // Duration in seconds for feedback popup
        this.activeField = 'tens';
        this.isSpeaking = false;
        this.showParentPeek = false;
        this.isAnswerLocked = false; // Prevents modifying answers after correct solution!
        this._feedbackTimer = null;

        // Current Question Model
        this.question = {
          steps: [],
          correctAnswer: 0,
          displayText: '',
          isSingleDigit: false
        };

        // Load saved progress from LocalStorage
        this.loadProgress();

        this.initDOMElements();
        this.syncUIWithState();
        this.attachEventListeners();
        this.setupSpeechSynthesis();
        this.generateNewQuestion(false); // First question loaded visually; audio waits for child to tap 'Listen'
      }

      // Load progress from localStorage
      loadProgress() {
        try {
          const saved = localStorage.getItem('uc_math_kids_progress');
          if (saved) {
            const data = JSON.parse(saved);
            if (typeof data.score === 'number') this.score = data.score;
            if (data.currentLevel) this.currentLevel = parseInt(data.currentLevel, 10);
            if (data.speechRate) this.speechRate = parseFloat(data.speechRate);
            if (typeof data.popupDuration === 'number') this.popupDuration = data.popupDuration;
            if (typeof data.showParentPeek === 'boolean') this.showParentPeek = data.showParentPeek;
          }
        } catch (e) {
          console.warn('Could not load localStorage:', e);
        }
      }

      // Save progress to localStorage
      saveProgress() {
        try {
          const data = {
            score: this.score,
            currentLevel: this.currentLevel,
            speechRate: this.speechRate,
            popupDuration: this.popupDuration,
            showParentPeek: this.showParentPeek
          };
          localStorage.setItem('uc_math_kids_progress', JSON.stringify(data));
        } catch (e) {
          console.warn('Could not save to localStorage:', e);
        }
      }

      initDOMElements() {
        this.scoreCounter = document.getElementById('score-counter');
        this.mascotAvatar = document.getElementById('mascot-avatar');
        this.mascotBox = document.getElementById('mascot-box');
        this.btnReplay = document.getElementById('btn-replay-audio');
        this.statusText = document.getElementById('status-text');
        this.inputsContainer = document.getElementById('inputs-container');
        this.boxTens = document.getElementById('box-tens');
        this.boxUnits = document.getElementById('box-units');
        this.labelTens = document.getElementById('label-tens');
        this.labelUnits = document.getElementById('label-units');
        this.inputTens = document.getElementById('input-tens');
        this.inputUnits = document.getElementById('input-units');
        this.keypad = document.getElementById('keypad');
        this.btnKeyReset = document.getElementById('btn-key-reset');
        this.btnCheck = document.getElementById('btn-check');
        this.btnNext = document.getElementById('btn-next');
        this.btnRetry = document.getElementById('btn-retry');

        // Feedback Popup Elements
        this.feedbackOverlay = document.getElementById('feedback-popup-overlay');
        this.feedbackCard = document.getElementById('feedback-popup-card');
        this.feedbackIcon = document.getElementById('feedback-popup-icon');
        this.feedbackText = document.getElementById('feedback-popup-text');
        this.feedbackEquation = document.getElementById('feedback-popup-equation');

        // Solved Problem Badge
        this.solvedProblemBadge = document.getElementById('solved-problem-badge');

        // Parent Peek
        this.parentPeekWrapper = document.getElementById('parent-peek-wrapper');
        this.btnPeek = document.getElementById('btn-peek');
        this.peekContent = document.getElementById('peek-content');

        // Settings Modal
        this.btnSettingsOpen = document.getElementById('btn-settings-open');
        this.settingsModal = document.getElementById('settings-modal');
        this.btnModalCloseX = document.getElementById('btn-close-modal-x');
        this.btnModalDone = document.getElementById('btn-modal-done');
        this.btnResetStorage = document.getElementById('btn-reset-storage');
      }

      syncUIWithState() {
        this.scoreCounter.textContent = this.score;

        // Active Level in Modal
        document.querySelectorAll('.level-btn[data-level]').forEach(btn => {
          if (parseInt(btn.dataset.level, 10) === this.currentLevel) {
            btn.classList.add('active');
          } else {
            btn.classList.remove('active');
          }
        });

        // Active Speed in Modal
        document.querySelectorAll('.level-btn[data-speed]').forEach(btn => {
          if (parseFloat(btn.dataset.speed) === this.speechRate) {
            btn.classList.add('active');
          } else {
            btn.classList.remove('active');
          }
        });

        // Active Popup Duration in Modal
        document.querySelectorAll('.level-btn[data-popup]').forEach(btn => {
          if (parseFloat(btn.dataset.popup) === this.popupDuration) {
            btn.classList.add('active');
          } else {
            btn.classList.remove('active');
          }
        });

        // Parent Peek Toggle
        if (this.parentPeekWrapper) {
          this.parentPeekWrapper.style.display = this.showParentPeek ? 'flex' : 'none';
        }
        document.querySelectorAll('.level-btn[data-showpeek]').forEach(btn => {
          const isShow = btn.dataset.showpeek === 'true';
          if (isShow === this.showParentPeek) {
            btn.classList.add('active');
          } else {
            btn.classList.remove('active');
          }
        });
      }

      attachEventListeners() {
        // Replay Question Audio
        this.btnReplay.addEventListener('click', () => {
          this.sound.playTap();
          this.speakQuestion();
        });

        this.mascotBox.addEventListener('click', () => {
          this.sound.playTap();
          this.speakQuestion();
        });

        // Input Focus
        this.inputTens.addEventListener('click', () => {
          if (this.boxTens.style.display !== 'none') {
            this.setActiveField('tens');
          }
        });
        this.inputUnits.addEventListener('click', () => this.setActiveField('units'));

        // Keypad button taps
        this.keypad.addEventListener('click', (e) => {
          const btn = e.target.closest('.key-btn');
          if (!btn) return;
          const key = btn.dataset.key;
          this.handleKeyInput(key);
        });

        // Physical Keyboard Support
        window.addEventListener('keydown', (e) => {
          if (e.key >= '0' && e.key <= '9') {
            this.handleKeyInput(e.key);
          } else if (e.key === 'Backspace' || e.key === 'Delete') {
            this.handleKeyInput('del');
          } else if (e.key === 'Enter') {
            if (this.btnNext.style.display === 'flex') {
              this.btnNext.click();
            } else if (this.btnRetry.style.display === 'flex') {
              this.btnRetry.click();
            } else {
              this.checkAnswer();
            }
          }
        });

        // Check Button
        this.btnCheck.addEventListener('click', () => this.checkAnswer());

        // Next Question Button
        this.btnNext.addEventListener('click', () => {
          this.sound.playTap();
          this.generateNewQuestion();
        });

        // Retry Question Button
        this.btnRetry.addEventListener('click', () => {
          this.sound.playTap();
          this.retryQuestion();
        });

        // Peek Question (Toggle for parents)
        this.btnPeek.addEventListener('click', () => {
          this.sound.playTap();
          const isVisible = this.peekContent.style.display === 'block';
          this.peekContent.style.display = isVisible ? 'none' : 'block';
        });

        // Settings Modal
        this.btnSettingsOpen.addEventListener('click', () => {
          this.sound.playTap();
          this.settingsModal.style.display = 'flex';
        });

        const closeModal = () => {
          this.sound.playTap();
          this.settingsModal.style.display = 'none';
          this.generateNewQuestion();
        };

        this.btnModalDone.addEventListener('click', closeModal);
        this.btnModalCloseX.addEventListener('click', closeModal);

        // Reset progress in LocalStorage
        this.btnResetStorage.addEventListener('click', () => {
          this.sound.playTap();
          if (confirm('Do you want to reset your stars to 0 and start over?')) {
            this.score = 0;
            this.saveProgress();
            this.syncUIWithState();
            this.showFeedback('warning', 'Stars have been reset to 0! ⭐');
          }
        });

        // Level selection in modal
        document.querySelectorAll('.level-btn[data-level]').forEach(btn => {
          btn.addEventListener('click', () => {
            this.sound.playTap();
            document.querySelectorAll('.level-btn[data-level]').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            this.currentLevel = parseInt(btn.dataset.level, 10);
            this.saveProgress();
          });
        });

        // Speed selection in modal
        document.querySelectorAll('.level-btn[data-speed]').forEach(btn => {
          btn.addEventListener('click', () => {
            this.sound.playTap();
            document.querySelectorAll('.level-btn[data-speed]').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            this.speechRate = parseFloat(btn.dataset.speed);
            this.saveProgress();
          });
        });

        // Popup Duration selection in modal
        document.querySelectorAll('.level-btn[data-popup]').forEach(btn => {
          btn.addEventListener('click', () => {
            this.sound.playTap();
            document.querySelectorAll('.level-btn[data-popup]').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            this.popupDuration = parseFloat(btn.dataset.popup);
            this.saveProgress();
          });
        });

        // Parent peek toggle in modal
        document.querySelectorAll('.level-btn[data-showpeek]').forEach(btn => {
          btn.addEventListener('click', () => {
            this.sound.playTap();
            document.querySelectorAll('.level-btn[data-showpeek]').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            this.showParentPeek = (btn.dataset.showpeek === 'true');
            if (this.parentPeekWrapper) {
              this.parentPeekWrapper.style.display = this.showParentPeek ? 'flex' : 'none';
            }
            this.saveProgress();
          });
        });

        // Feedback Popup click to dismiss immediately
        this.feedbackOverlay.addEventListener('click', () => {
          this.hideFeedback();
        });
      }

      setActiveField(field, playSound = false) {
        if (this.isAnswerLocked) return;
        this.activeField = field;
        if (playSound) this.sound.playTap();

        if (field === 'tens') {
          this.inputTens.classList.add('active');
          this.inputUnits.classList.remove('active');
        } else {
          this.inputUnits.classList.add('active');
          this.inputTens.classList.remove('active');
        }
      }

      handleKeyInput(key) {
        if (this.isAnswerLocked) return;
        this.sound.playTap();

        if (key === 'reset') {
          this.retryQuestion();
          return;
        }

        if (key === 'del') {
          if (this.question.isSingleDigit) {
            this.inputUnits.textContent = '_';
            return;
          }

          if (this.activeField === 'units') {
            if (this.inputUnits.textContent !== '_') {
              this.inputUnits.textContent = '_';
            } else {
              // Units is already empty, move back to tens and clear it
              this.inputTens.textContent = '_';
              this.setActiveField('tens', true);
            }
          } else {
            this.inputTens.textContent = '_';
          }
          return;
        }

        // If Single Digit problem (only units field visible)
        if (this.question.isSingleDigit) {
          this.inputUnits.textContent = key;
          return;
        }

        // Two digits problem:
        if (this.activeField === 'tens') {
          this.inputTens.textContent = key;
          // Automatically advance to units field!
          this.setActiveField('units', true);
        } else {
          this.inputUnits.textContent = key;
        }
      }

      setupSpeechSynthesis() {
        if ('speechSynthesis' in window) {
          const updateVoices = () => {
            this.voices = window.speechSynthesis.getVoices();
          };
          updateVoices();
          if (window.speechSynthesis.onvoiceschanged !== undefined) {
            window.speechSynthesis.onvoiceschanged = updateVoices;
          }
        }
      }

      // Best Female English Voice Selector
      getBestFemaleVoice() {
        if (!this.voices || this.voices.length === 0) {
          this.voices = ('speechSynthesis' in window) ? window.speechSynthesis.getVoices() : [];
        }
        if (!this.voices || this.voices.length === 0) return null;

        const enVoices = this.voices.filter(v => (v.lang || '').toLowerCase().startsWith('en'));
        const femaleKeywords = ['zira', 'jenny', 'samantha', 'victoria', 'karen', 'female', 'natural'];
        let match = enVoices.find(v => femaleKeywords.some(k => v.name.toLowerCase().includes(k)));
        return match || enVoices[0] || this.voices[0] || null;
      }

      // Generate New Question (Strict UC Math rules)
      generateNewQuestion(shouldSpeak = true) {
        let numSteps = this.currentLevel === 4 ? 3 : 2;
        let isTwoDigits = (this.currentLevel === 3 || this.currentLevel === 4);

        let steps = [];
        let currentTotal = 0;

        if (isTwoDigits) {
          // Both addition and subtraction MUST use 2-digit numbers (10 to 99)
          // AND Tens sum <= 9, Units sum <= 9 (No carry in units, No carry in tens, No borrowing in subtraction!)
          let curT, curU;

          for (let i = 0; i < numSteps; i++) {
            if (i === 0) {
              let minT = numSteps === 3 ? 3 : 2;
              let maxT = numSteps === 3 ? 7 : 8;
              let minU = numSteps === 3 ? 2 : 1;
              let maxU = numSteps === 3 ? 7 : 8;

              curT = Math.floor(Math.random() * (maxT - minT + 1)) + minT;
              curU = Math.floor(Math.random() * (maxU - minU + 1)) + minU;

              const val = curT * 10 + curU;
              steps.push({ op: '+', val });
              currentTotal = val;
            } else {
              const canAdd = (9 - curT) >= 1 && (9 - curU) >= 0;
              const canSubtract = (curT - 1) >= 1 && curU >= 0;

              let op;
              if (canAdd && canSubtract) {
                op = Math.random() > 0.5 ? '+' : '-';
              } else if (canAdd) {
                op = '+';
              } else {
                op = '-';
              }

              let t, u;
              if (op === '+') {
                const maxT = 9 - curT;
                t = Math.floor(Math.random() * maxT) + 1;

                const maxU = 9 - curU;
                u = maxU > 0 ? (Math.floor(Math.random() * (maxU + 1))) : 0;

                curT += t;
                curU += u;
              } else {
                const maxT = curT - 1;
                t = Math.floor(Math.random() * maxT) + 1;

                const maxU = curU;
                u = maxU > 0 ? (Math.floor(Math.random() * (maxU + 1))) : 0;

                curT -= t;
                curU -= u;
              }

              const val = t * 10 + u;
              currentTotal = curT * 10 + curU;
              steps.push({ op, val });
            }
          }
        } else if (this.currentLevel === 1) {
          // Single digit only (1 to 9) - Units sum <= 9
          for (let i = 0; i < numSteps; i++) {
            if (i === 0) {
              const val = Math.floor(Math.random() * 8) + 1;
              steps.push({ op: '+', val });
              currentTotal = val;
            } else {
              const canAdd = (9 - currentTotal) >= 1;
              const canSubtract = currentTotal > 1;

              let op = (canSubtract && (!canAdd || Math.random() > 0.5)) ? '-' : '+';
              let val;
              if (op === '-') {
                val = Math.floor(Math.random() * (currentTotal - 1)) + 1;
                currentTotal -= val;
              } else {
                val = Math.floor(Math.random() * (9 - currentTotal)) + 1;
                currentTotal += val;
              }
              steps.push({ op, val });
            }
          }
        } else {
          // Level 2: Up to 20 - Units sum <= 9
          for (let i = 0; i < numSteps; i++) {
            if (i === 0) {
              const u0 = Math.floor(Math.random() * 6) + 1;
              const val = 10 + u0; // e.g. 11 to 16
              steps.push({ op: '+', val });
              currentTotal = val;
            } else {
              const curU = currentTotal % 10;
              const canAdd = (9 - curU) >= 1 && (20 - currentTotal) >= 1;
              const canSubtract = curU >= 1;

              let op = (canSubtract && (!canAdd || Math.random() > 0.5)) ? '-' : '+';
              let val;
              if (op === '-') {
                val = Math.floor(Math.random() * curU) + 1;
                currentTotal -= val;
              } else {
                val = Math.floor(Math.random() * (9 - curU)) + 1;
                currentTotal += val;
              }
              steps.push({ op, val });
            }
          }
        }

        const isSingleDigit = currentTotal < 10;

        this.question = {
          steps,
          correctAnswer: currentTotal,
          displayText: steps.map((s, idx) => (idx === 0 ? `${s.val}` : `${s.op} ${s.val}`)).join(' ') + ' = ?',
          isSingleDigit: isSingleDigit
        };

        this.peekContent.textContent = this.question.displayText;
        this.peekContent.style.display = 'none';

        // Adapt fields dynamically: 1 field if answer < 10, 2 fields if answer >= 10
        this.updateInputFieldsLayout();

        // Speak immediately when requested
        if (shouldSpeak) {
          setTimeout(() => {
            this.speakQuestion();
          }, 200);
        } else {
          this.statusText.textContent = 'Click listen to start! 👂';
        }
      }

      updateInputFieldsLayout() {
        this.resetUIStates();

        if (this.question.isSingleDigit) {
          // Single field only!
          this.boxTens.style.display = 'none';
          this.labelUnits.textContent = 'Answer';
          this.setActiveField('units');
        } else {
          // Two fields: Tens on Left, Units on Right
          this.boxTens.style.display = 'flex';
          this.labelTens.textContent = 'Tens';
          this.labelUnits.textContent = 'Units';
          this.setActiveField('tens');
        }
      }

      // Stop any currently playing speech
      stopAllSpeech() {
        if ('speechSynthesis' in window) {
          try {
            window.speechSynthesis.cancel();
          } catch (e) {}
        }
        this.isSpeaking = false;
        this.mascotAvatar.classList.remove('speaking');
        this.btnReplay.classList.remove('speaking');
      }

      // Clear, friendly English Speech Synthesis
      speakQuestion() {
        this.stopAllSpeech();

        // 1. Prepare English Text
        let textToSpeak = '';
        this.question.steps.forEach((step, idx) => {
          if (idx === 0) {
            textToSpeak += `${step.val} , `;
          } else {
            const opWord = step.op === '+' ? 'plus' : 'minus';
            textToSpeak += `${opWord} ${step.val} , `;
          }
        });

        const cleanText = textToSpeak.trim();

        // Update UI to speaking state
        this.isSpeaking = true;
        this.mascotAvatar.classList.add('speaking');
        this.btnReplay.classList.add('speaking');
        this.statusText.textContent = 'Listen carefully... 🎧';

        const onFinished = () => {
          this.isSpeaking = false;
          this.mascotAvatar.classList.remove('speaking');
          this.btnReplay.classList.remove('speaking');
          this.statusText.textContent = 'What is your answer? Enter below 👇';
          window._activeUtterance = null;
        };

        if (!('speechSynthesis' in window)) {
          console.warn('SpeechSynthesis is not supported in this browser.');
          onFinished();
          return;
        }

        try {
          if (window.speechSynthesis.paused) {
            window.speechSynthesis.resume();
          }
          window.speechSynthesis.cancel();
        } catch (e) {}

        const utter = new SpeechSynthesisUtterance(cleanText);
        utter.rate = this.speechRate || 0.75;
        utter.pitch = 1.15;
        utter.lang = 'en-US';

        const voice = this.getBestFemaleVoice();
        if (voice) {
          utter.voice = voice;
          if (voice.lang) utter.lang = voice.lang;
        }

        utter.onstart = () => {
          this.isSpeaking = true;
          this.mascotAvatar.classList.add('speaking');
          this.btnReplay.classList.add('speaking');
        };

        utter.onend = () => {
          onFinished();
        };

        utter.onerror = (e) => {
          console.warn('Speech error:', e);
          onFinished();
          if (e.error === 'not-allowed') {
            this.statusText.textContent = 'Click Listen 🔊 to start!';
          }
        };

        window._activeUtterance = utter;

        try {
          window.speechSynthesis.speak(utter);
        } catch (e) {
          console.error('Speech speak failed:', e);
          onFinished();
        }
      }

      checkAnswer() {
        let userVal;

        if (this.question.isSingleDigit) {
          const uVal = this.inputUnits.textContent.trim();
          if (uVal === '_') {
            this.showFeedback('warning', 'Please enter your answer first! ✍️');
            return;
          }
          userVal = parseInt(uVal, 10);
        } else {
          const tVal = this.inputTens.textContent.trim();
          const uVal = this.inputUnits.textContent.trim();

          if (tVal === '_' || uVal === '_') {
            this.showFeedback('warning', 'Please enter both digits! ✍️');
            return;
          }
          userVal = parseInt(tVal, 10) * 10 + parseInt(uVal, 10);
        }

        if (userVal === this.question.correctAnswer) {
          this.handleCorrect();
        } else {
          this.handleWrong();
        }
      }

      handleCorrect() {
        this.isAnswerLocked = true;
        if (this.inputsContainer) {
          this.inputsContainer.style.pointerEvents = 'none';
        }

        this.sound.playFanfare();
        this.confetti.fire();

        this.score += 1;
        this.scoreCounter.textContent = this.score;
        this.saveProgress();

        this.inputUnits.classList.add('success-pop');
        if (!this.question.isSingleDigit) {
          this.inputTens.classList.add('success-pop');
        }

        const equationText = this.question.steps.map((s, idx) => (idx === 0 ? `${s.val}` : `${s.op} ${s.val}`)).join(' ') + ' = ' + this.question.correctAnswer;

        if (this.solvedProblemBadge) {
          this.solvedProblemBadge.textContent = '🎯 Problem: ' + equationText + ' ✔️';
          this.solvedProblemBadge.style.display = 'inline-flex';
        }

        this.showFeedback('success', 'Genius! Correct & Excellent! 🌟', equationText);
        this.statusText.textContent = 'Awesome! You solved: ' + equationText + ' 🏆';

        this.btnCheck.style.display = 'none';
        this.btnRetry.style.display = 'none';
        this.btnNext.style.display = 'flex';
      }

      handleWrong() {
        this.sound.playComicalWrong();

        this.inputUnits.classList.add('shake-error');
        if (!this.question.isSingleDigit) {
          this.inputTens.classList.add('shake-error');
        }

        setTimeout(() => {
          this.inputUnits.classList.remove('shake-error');
          this.inputTens.classList.remove('shake-error');
        }, 600);

        this.showFeedback('error', 'Oops! Not quite right.. Try again, superstar!');
        this.statusText.textContent = 'No worries, tap Try Again and solve it 💪';

        this.btnCheck.style.display = 'none';
        this.btnRetry.style.display = 'flex';
        this.btnNext.style.display = 'none';
      }

      retryQuestion() {
        this.resetUIStates();

        if (this.question.isSingleDigit) {
          this.setActiveField('units');
        } else {
          this.setActiveField('tens');
        }

        this.speakQuestion();
      }

      resetUIStates() {
        this.isAnswerLocked = false;
        if (this.inputsContainer) {
          this.inputsContainer.style.pointerEvents = 'auto';
        }

        this.inputTens.textContent = '_';
        this.inputUnits.textContent = '_';
        this.inputTens.classList.remove('shake-error', 'success-pop');
        this.inputUnits.classList.remove('shake-error', 'success-pop');
        if (this.solvedProblemBadge) {
          this.solvedProblemBadge.style.display = 'none';
        }
        this.hideFeedback();

        this.btnCheck.style.display = 'flex';
        this.btnNext.style.display = 'none';
        this.btnRetry.style.display = 'none';
      }

      // Auto-Dismissing Popup Modal
      showFeedback(type, message, equation = '') {
        if (this._feedbackTimer) {
          clearTimeout(this._feedbackTimer);
          this._feedbackTimer = null;
        }

        this.feedbackCard.className = `feedback-popup-card ${type}`;
        this.feedbackIcon.textContent = type === 'success' ? '🎉' : type === 'error' ? '💡' : '⭐';
        this.feedbackText.textContent = message;

        if (this.feedbackEquation) {
          if (equation) {
            this.feedbackEquation.textContent = equation;
            this.feedbackEquation.style.display = 'inline-block';
          } else {
            this.feedbackEquation.style.display = 'none';
          }
        }

        this.feedbackOverlay.classList.add('show');

        // Auto-dismiss after user-configured duration
        const durationMs = (this.popupDuration || 2) * 1000;
        this._feedbackTimer = setTimeout(() => {
          this.hideFeedback();
        }, durationMs);
      }

      hideFeedback() {
        if (this._feedbackTimer) {
          clearTimeout(this._feedbackTimer);
          this._feedbackTimer = null;
        }
        if (this.feedbackOverlay) {
          this.feedbackOverlay.classList.remove('show');
        }
      }
    }

    // Launch App when DOM is loaded
    window.addEventListener('DOMContentLoaded', () => {
      window.app = new UCMathApp();
    });
  </script>
</body>
